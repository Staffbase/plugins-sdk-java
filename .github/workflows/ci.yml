# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Continuous Integration

on:
  push:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    name: Java ${{ matrix.java }} Test
    strategy:
      matrix:
        # test against LTS versions supported by Temurin:
        java: [ '8', '11', '17', '21' ]
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'

    - name: Get latest release tag
      id: latest_release
      run: |
        tag=$(curl -s https://api.github.com/repos/Staffbase/plugins-sdk-java/releases/latest | jq -r .tag_name)
        echo "tag_name=$tag" >> $GITHUB_OUTPUT

    - name: Build with Maven
      run: mvn -B package --file pom.xml -Drevision=${{ steps.latest_release.outputs.tag_name }}

    - name: Run UI tests
      run: make test

    - name: Upload JUnit XML report
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: junit-xml-${{ matrix.java }}
        path: '**/target/surefire-reports/*.xml'
        retention-days: 1
        if-no-files-found: warn

  push-test-results:
    name: Push test results
    if: ${{ always() }}
    needs: [build-test]
    uses: Staffbase/test-monitoring-connector-junit/.github/workflows/connector-junit.yml@a695b35c6b678742bc696a378dc9a307e96cebcd # includes module-fetch retry fix (test-monitoring-connector-junit#12)
    with:
      artifact-pattern: junit-xml-*
      glob: '**/target/surefire-reports/*.xml'
      connector-version: a695b35c6b678742bc696a378dc9a307e96cebcd # v2026.28.2 (per-test started_at fix)
      app-id: ${{ vars.STAFFBASE_ACTIONS_CLIENT_ID }}
    secrets:
      service-secret: ${{ secrets.TEST_MONITORING_SERVICE_SECRET }}
      app-private-key: ${{ secrets.STAFFBASE_ACTIONS_PRIVATE_KEY }}
